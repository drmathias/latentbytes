name: Monthly Outdated Content Check

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: 

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Outdated Check Script
        id: scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/outdated-check.py

      - name: Create Pull Request
        if: steps.scanner.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[Automated] update outdated blog content"
          title: ${{ steps.scanner.outputs.pr_title }}
          body: ${{ steps.scanner.outputs.pr_body }}
          branch: outdated-content-updates
          delete-branch: true
          labels: |
            automated-check
            content
